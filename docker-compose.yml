name: slurm-hpc

# ==============================================================================
# HPC Cluster Simulation Environment (Debian Trixie)
# ==============================================================================
# Hardening: cap_drop ALL + no-new-privileges on every service.
# Capabilities are added back only where the role needs them.
# ==============================================================================

services:
  # ---------------------------------------------------------------------------
  # Monitoring Stack
  # ---------------------------------------------------------------------------
  grafana:
    container_name: influxdb_local
    image: philhawthorne/docker-influxdb-grafana:latest
    volumes:
      - usrlocalinfluxdb-foo:/var/lib/influxdb
      - usrlocalgrafana-foo:/var/lib/grafana
    ports:
      - "3003:3003"
      - "3004:8083"
      - "8086:8086"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - mpinet

  # ---------------------------------------------------------------------------
  # Database Backend for Slurm Accounting
  # ---------------------------------------------------------------------------
  mysql:
    image: mariadb:10.10
    hostname: mysql
    container_name: mysql
    environment:
      MARIADB_ROOT_PASSWORD: password
      MARIADB_DATABASE: slurm_acct_db
      MARIADB_USER: slurm
      MARIADB_PASSWORD: password
    volumes:
      - var_lib_mysql:/var/lib/mysql
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    networks:
      - mpinet
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Slurm Database Daemon
  # ---------------------------------------------------------------------------
  slurmdbd:
    image: jmbatto/m2chps-mpi41-slurm:latest
    container_name: slurmdbd
    hostname: slurmdbd
    volumes:
      - etc_munge:/etc/munge
      - var_log_slurm:/var/log/slurm
    environment:
      - SLURMPARAM=slurmdbd
    expose:
      - "6819"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "netstat -tuln | grep 6819"]
      interval: 10s
      timeout: 5s
      retries: 5
    shm_size: "512m"
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    secrets:
      - source: "id_rsa"
        target: "/home/mpiuser/.ssh-source/id_rsa"
      - source: "id_rsa_mpi_pub"
        target: "/home/mpiuser/.ssh-source/id_rsa.pub"
      - source: "authorized_keys"
        target: "/home/mpiuser/.ssh-source/authorized_keys"
    networks:
      - mpinet

  # ---------------------------------------------------------------------------
  # Slurm Controller (Head Node)
  # ---------------------------------------------------------------------------
  slurmctld:
    image: jmbatto/m2chps-mpi41-slurm:latest
    container_name: slurmctld
    hostname: slurmctld
    volumes:
      - etc_munge:/etc/munge
      - slurm_jobdir:/data
      - var_log_slurm:/var/log/slurm
      - usrlocalvarmpi-foo:/usr/local/var/mpishare
      - usrlocalworkproject:/work/project
    environment:
      - SLURMPARAM=slurmctld
    expose:
      - "6817"
    depends_on:
      slurmdbd:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "scontrol ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    shm_size: "512m"
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
      - KILL
      - NET_BIND_SERVICE
      - SYS_NICE
    security_opt:
      - no-new-privileges:true
    secrets:
      - source: "id_rsa"
        target: "/home/mpiuser/.ssh-source/id_rsa"
      - source: "id_rsa_mpi_pub"
        target: "/home/mpiuser/.ssh-source/id_rsa.pub"
      - source: "authorized_keys"
        target: "/home/mpiuser/.ssh-source/authorized_keys"
    networks:
      - mpinet

  # ---------------------------------------------------------------------------
  # Compute Node 1
  # ---------------------------------------------------------------------------
  c1:
    image: jmbatto/m2chps-mpi41-slurm:latest
    hostname: c1
    container_name: c1
    volumes:
      - etc_munge:/etc/munge
      - slurm_jobdir:/data
      - var_log_slurm:/var/log/slurm
      - usrlocalvarmpi-foo:/usr/local/var/mpishare
      - usrlocalworkproject:/work/project
    environment:
      - SLURMPARAM=slurmd
    expose:
      - "6818"
    depends_on:
      slurmctld:
        condition: service_healthy
    shm_size: "512m"
    ulimits:
      memlock: -1
      stack: 67108864
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
      - KILL
      - NET_BIND_SERVICE
      - SYS_NICE
      - SYS_PTRACE
      - IPC_LOCK
    security_opt:
      - no-new-privileges:true
    secrets:
      - source: "id_rsa"
        target: "/home/mpiuser/.ssh-source/id_rsa"
      - source: "id_rsa_mpi_pub"
        target: "/home/mpiuser/.ssh-source/id_rsa.pub"
      - source: "authorized_keys"
        target: "/home/mpiuser/.ssh-source/authorized_keys"
    networks:
      - mpinet

  # ---------------------------------------------------------------------------
  # Compute Node 2
  # ---------------------------------------------------------------------------
  c2:
    image: jmbatto/m2chps-mpi41-slurm:latest
    hostname: c2
    container_name: c2
    volumes:
      - etc_munge:/etc/munge
      - slurm_jobdir:/data
      - var_log_slurm:/var/log/slurm
      - usrlocalvarmpi-foo:/usr/local/var/mpishare
      - usrlocalworkproject:/work/project
    environment:
      - SLURMPARAM=slurmd
    expose:
      - "6818"
    depends_on:
      slurmctld:
        condition: service_healthy
    shm_size: "512m"
    ulimits:
      memlock: -1
      stack: 67108864
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
      - KILL
      - NET_BIND_SERVICE
      - SYS_NICE
      - SYS_PTRACE
      - IPC_LOCK
    security_opt:
      - no-new-privileges:true
    secrets:
      - source: "id_rsa"
        target: "/home/mpiuser/.ssh-source/id_rsa"
      - source: "id_rsa_mpi_pub"
        target: "/home/mpiuser/.ssh-source/id_rsa.pub"
      - source: "authorized_keys"
        target: "/home/mpiuser/.ssh-source/authorized_keys"
    networks:
      - mpinet

# ==============================================================================
# Secrets Configuration
# ==============================================================================
secrets:
  id_rsa_mpi_pub:
    file: ssh/id_rsa.mpi.pub
  id_rsa:
    file: ssh/id_rsa.mpi
  authorized_keys:
    file: ssh/id_rsa.mpi.pub

# ==============================================================================
# Network Configuration
# ==============================================================================
networks:
  mpinet:
    driver: bridge
    name: mpinet

# ==============================================================================
# Persistent Volumes
# ==============================================================================
volumes:
  etc_munge:
  slurm_jobdir:
  var_lib_mysql:
  var_log_slurm:
  usrlocalvarmpi-foo:
  usrlocalworkproject:
    external: true
  usrlocalgrafana-foo:
  usrlocalinfluxdb-foo:
